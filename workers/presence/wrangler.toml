# Live player counter (free Workers plan: SQLite-backed Durable Object, memory only).
# Deploy once:  cd workers/presence && npx wrangler deploy
name = "fps-shooter-presence"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "Presence"

# Free plan: Durable Objects must use the SQLite backend.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Presence"]
